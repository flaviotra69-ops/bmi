<!DOCTYPE html>
<!-- Dichiarazione dello standard HTML5 -->
<html lang="it">
<head>
    <!-- Codifica caratteri UTF-8 per la gestione di accenti e simboli -->
    <meta charset="UTF-8">
    <!-- Viewport per garantire la corretta resa responsive su tutti i dispositivi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <!-- Tailwind CSS CDN per gestione stili moderna e responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importazione del foglio di stile esterno style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenitore unico centrato a singola colonna -->
    <main class="flex flex-col items-center justify-center w-full">
        
        <!-- Titolo della Pagina -->
        <h1 class="page-title">Calcolatore BMI</h1>

        <!-- Card Principale -->
        <div class="bmi-card">
            <!-- 
                Form HTML inviato a calcola.php tramite metodo POST
                - action="calcola.php": Specifica il file PHP che gestirà i dati inviati.
                - method="POST": Invia i dati in modo protetto nel corpo della richiesta HTTP.
            -->
            <form action="calcola.php" method="POST">
                <!-- Campo 1: Nome -->
                <div class="form-group">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Es. Mario" required>
                </div>

                <!-- Campo 2: Peso -->
                <div class="form-group">
                    <label for="weight" class="form-label">Peso (kg)</label>
                    <input type="number" id="weight" name="weight" class="form-input" step="0.1" min="1" max="300" placeholder="Es. 70" required>
                </div>

                <!-- Campo 3: Altezza -->
                <div class="form-group">
                    <label for="height" class="form-label">Altezza (cm)</label>
                    <input type="number" id="height" name="height" class="form-input" step="1" min="30" max="250" placeholder="Es. 175" required>
                </div>

                <!-- Pulsante di Invio -->
                <button type="submit" class="submit-btn">Calcola</button>
            </form>
        </div>

    </main>

</body>
</html>
